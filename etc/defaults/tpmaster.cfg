# TerraPulse master broker, SeisComp scmaster-style.
queues = production, playback

defaultGroups = WAVEFORM, FEATURE, WFPARAM, ANOMALY, EVENT, QC, STATUS, CONFIG, INVENTORY, JOURNAL

interface.bind = 0.0.0.0:5561
interface.publish = 0.0.0.0:5562
interface.control = 0.0.0.0:5563

queues.production.plugins = dbstore
queues.production.processors.messages = dbstore
queues.production.processors.messages.dbstore.driver = sqlite
queues.production.processors.messages.dbstore.read = var/lib/terrapulse.db
queues.production.processors.messages.dbstore.write = var/lib/terrapulse.db
queues.production.processors.messages.dbstore.strictVersionMatch = true

queues.playback.acl = 127.0.0.1
queues.playback.persist = false
