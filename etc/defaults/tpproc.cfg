# tpproc — analysis & anomaly detection defaults (shipped; do not edit).
# Override in etc/tpproc.cfg. These are the knobs a structural engineer tunes.

# ── Windowing ─────────────────────────────────────────────────────────────────
# Samples per analysis window. Shorter = faster anomaly reaction, coarser stats.
# At 200 Hz, 100 samples = 0.5 s.
proc.window = 100

# Samples used for the natural (modal) frequency estimate. Longer = finer
# frequency resolution, which is what makes a small frequency drift visible.
# At 200 Hz, 1024 samples = 5.1 s -> ~0.2 Hz bins. Detection stays on proc.window.
proc.freqWindow = 1024

# Band searched for the dominant/natural frequency (Hz). fMax = 0 means Nyquist.
proc.freqBandMin = 0.3
proc.freqBandMax = 0

# ── Baseline calibration ──────────────────────────────────────────────────────
# Windows of "quiet" startup used to learn the structure's normal RMS/energy/
# frequency. No alarms are raised while calibrating.
proc.calibrationWindows = 20

# ── STA/LTA onset detector (hysteresis) ───────────────────────────────────────
# Short/long-term average of window RMS. A trigger opens above onRatio and closes
# below offRatio, so a single-window spike cannot raise an anomaly.
# Alpha values are EMA smoothing factors (1/alpha ~ number of windows averaged).
proc.staLta.staAlpha  = 0.34
proc.staLta.ltaAlpha  = 0.02
proc.staLta.onRatio   = 3.0
proc.staLta.offRatio  = 1.5

# ── Anomaly thresholds (relative to the learned baseline) ─────────────────────
proc.threshold.rmsWarning     = 2.0
proc.threshold.rmsCritical    = 4.0
proc.threshold.energyWarning  = 3.0
proc.threshold.energyCritical = 6.0

# Absolute amplitude thresholds (gal). A critical overload alarms immediately,
# without waiting for STA/LTA confirmation.
proc.threshold.ampWarning  = 50.0
proc.threshold.ampCritical = 100.0

# Natural-frequency shift vs baseline (Hz) — the stiffness-loss indicator.
proc.threshold.freqShiftWarning  = 5.0
proc.threshold.freqShiftCritical = 15.0

# Health index bands (1.0 = perfect, 0.0 = critical).
proc.threshold.healthWarning  = 0.6
proc.threshold.healthCritical = 0.3

# ── Health index weights (must sum to 1.0) ────────────────────────────────────
proc.health.wRms    = 0.35
proc.health.wEnergy = 0.25
proc.health.wAmp    = 0.25
proc.health.wFreq   = 0.15
