# tpwfparam — strong-motion parameters (shipped; do not edit).
# Override in etc/tpwfparam.cfg.

# Rolling window of acceleration used per computation (seconds).
wfparam.windowSec = 10

# How often parameters are recomputed and published (seconds).
wfparam.periodSec = 2

# ── Response spectrum ─────────────────────────────────────────────────────────
# Damping ratio for the SDOF oscillator (0.05 = 5%, the engineering standard).
wfparam.damping = 0.05

# Periods (s) at which the response spectrum is evaluated, comma separated.
# These should cover the natural periods of the monitored structures.
wfparam.periods = 0.1,0.15,0.2,0.3,0.5,0.75,1.0,1.5,2.0,3.0

# ── Intensity ─────────────────────────────────────────────────────────────────
# JMA instrumental intensity (計測震度): amplitude sustained this long (s) sets
# the level. NOTE: the full JMA definition also applies period/high-cut/low-cut
# filters before this step; the current implementation is a time-domain estimate.
wfparam.jmaSustainSec = 0.3
