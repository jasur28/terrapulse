# tpacq — acquisition (shipped; do not edit).
# Override in etc/tpacq.cfg.

# Serial device settings (when acquiring from a real sensor).
acq.baudRate = 460800

# Store-and-forward: seconds of samples buffered while the broker is down and
# resent on reconnect. 0 disables buffering.
acq.bufferSec = 60

# Write raw waveforms to the miniSEED archive (archive.tds in global.cfg).
acq.archive = true
