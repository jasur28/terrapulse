# TerraPulse — global defaults (shipped; do not edit).
#
# Override in <root>/etc/global.cfg (site) or ~/.terrapulse/global.cfg (user).
# Command-line flags override every file.
#
# Layer order (later wins):
#   etc/defaults/global.cfg -> etc/defaults/<module>.cfg
#   etc/global.cfg          -> etc/<module>.cfg
#   ~/.terrapulse/global.cfg-> ~/.terrapulse/<module>.cfg

# ── Connection ────────────────────────────────────────────────────────────────
# Host running tpmaster. Every module needs only this address.
connection.server = 127.0.0.1

# Message queue to attach to: production (live) | playback (review/re-analysis).
connection.queue = production

# ── Paths ─────────────────────────────────────────────────────────────────────
# miniSEED waveform archive (TDS). Written by tpacq/tpslink, read for review.
archive.tds = var/tds

# SQLite database written by tpmaster (single writer).
database.path = terrapulse.db

# ── Sensor identity defaults (overridden per binding/profile) ─────────────────
sensor.station = 1
sensor.object  = 1
sensor.id      = 1
sensor.rate    = 200
