# Named queries for tpquery. Use ? for arguments (passed on the command line).
# Format:  <name> = <SQL>   # description

worst-health   = SELECT object, sensor, last_health, last_warning, datetime(last_seen_ms/1000,'unixepoch') AS last_seen FROM sensors ORDER BY last_health ASC LIMIT ?   # sensors with the lowest health (arg: limit)
recent-events  = SELECT event_id, object, severity, anomaly_types, sensor_count, shf_count, datetime(t_start_ms/1000,'unixepoch') AS started FROM anomaly_events ORDER BY t_start_ms DESC LIMIT ?   # most recent anomaly events (arg: limit)
events-since   = SELECT event_id, object, severity, anomaly_types, datetime(t_start_ms/1000,'unixepoch') AS started FROM anomaly_events WHERE t_start_ms >= strftime('%s', ?)*1000 ORDER BY t_start_ms   # events since a date (arg: YYYY-MM-DD)
open-events    = SELECT event_id, object, severity, anomaly_types, sensor_count FROM anomaly_events WHERE status = 0   # events still active
freq-drift     = SELECT object, sensor, axis, ROUND(AVG(dom_freq),3) AS avg_freq, COUNT(*) AS windows FROM saf_index GROUP BY object, sensor, axis   # mean natural frequency per channel (stiffness-loss baseline)
unreviewed     = SELECT shf_id, object, sensor, severity, datetime(t_start_ms/1000,'unixepoch') AS started FROM events WHERE review = 0 ORDER BY t_start_ms DESC LIMIT ?   # anomalies awaiting operator review (arg: limit)
