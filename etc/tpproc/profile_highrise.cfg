# Profile "highrise" — a tall building sways more in normal use, so vibration
# limits are looser, but a natural-frequency drop matters much sooner (stiffness
# loss shows up in the frequency long before amplitude).
proc.threshold.rmsWarning        = 3.0
proc.threshold.rmsCritical       = 6.0
proc.threshold.ampWarning        = 80.0
proc.threshold.ampCritical       = 150.0
proc.threshold.freqShiftWarning  = 1.0
proc.threshold.freqShiftCritical = 3.0
