<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="TerraPulse">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2440"/>
      <stop offset="1" stop-color="#12162A"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00C853"/>
    </linearGradient>
  </defs>

  <!-- Icon tile -->
  <rect x="16" y="20" width="120" height="120" rx="26" fill="url(#tile)"/>
  <rect x="16.5" y="20.5" width="119" height="119" rx="25.5" fill="none" stroke="#00E5FF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Baseline (structure ground) -->
  <line x1="30" y1="112" x2="122" y2="112" stroke="#3A4260" stroke-width="2" stroke-linecap="round"/>

  <!-- Pulse / heartbeat of the structure -->
  <polyline points="30,80 52,80 60,80 66,58 72,104 78,42 86,92 94,80 122,80"
            fill="none" stroke="url(#pulse)" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="78" cy="42" r="4.5" fill="#00E5FF"/>

  <!-- Wordmark -->
  <text x="164" y="88" font-family="Segoe UI, Roboto, Arial, sans-serif"
        font-size="58" font-weight="700" letter-spacing="0.5">
    <tspan fill="#E6EAF2">Terra</tspan><tspan fill="#00E5FF">Pulse</tspan>
  </text>
  <text x="166" y="120" font-family="Segoe UI, Roboto, Arial, sans-serif"
        font-size="17" font-weight="500" letter-spacing="3" fill="#8A94A6">
    STRUCTURAL HEALTH MONITORING
  </text>
</svg>
